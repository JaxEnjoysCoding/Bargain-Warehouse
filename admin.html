<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Panel | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        header { background: #1e293b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
        header h1 { font-size: 1.5rem; color: #f59e0b; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1000px; margin: 3rem auto; padding: 0 1rem; }
        .panel-title { margin-bottom: 2rem; color: #f59e0b; display: flex; justify-content: space-between; align-items: center; }
        .product-manager-card { background: #1e293b; border-radius: 8px; padding: 2rem; margin-bottom: 2rem; border: 1px solid #334155; }
        .product-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.5rem; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #334155; }
        .product-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .product-name { font-weight: bold; font-size: 1.1rem; color: #e2e8f0; }
        .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.25rem; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 0.6rem; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 4px; font-size: 1rem; }
        .input-group input:focus { outline: 2px solid #f59e0b; }
        .save-banner { background: #10b981; color: white; padding: 1rem; border-radius: 6px; text-align: center; margin-bottom: 2rem; display: none; font-weight: bold; }
        .btn-save { background: #f59e0b; color: #1e293b; font-weight: bold; padding: 1rem 2rem; border: none; border-radius: 4px; cursor: pointer; display: block; width: 100%; font-size: 1.1rem; margin-top: 2rem; }
        .btn-save:hover { background: #d97706; }
    </style>
</head>
<body>

    <header>
        <h1>🏗️ Warehouse Operations Control</h1>
        <button class="logout-btn" onclick="logout()">Exit Terminal</button>
    </header>

    <main class="container">
        <div class="panel-title">
            <h2>Live Inventory & Price Master</h2>
            <span style="font-size: 0.9rem; background: #334155; padding: 0.25rem 0.75rem; border-radius: 20px; color: #94a3b8;">Status: Secure Session</span>
        </div>

        <div id="save-alert" class="save-banner">✓ Inventory parameters saved successfully! Live store updated.</div>

        <form id="admin-form">
            <div class="product-manager-card">
                <!-- Product 1 -->
                <div class="product-row">
                    <div class="product-name">Premium Framing Lumber</div>
                    <div class="input-group">
                        <label>Price (\$)</label>
                        <input type="number" step="0.01" id="p1-price">
                    </div>
                    <div class="input-group">
                        <label>Stock Count</label>
                        <input type="number" id="p1-stock">
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="product-row">
                    <div class="product-name">Portland Cement Bag</div>
                    <div class="input-group">
                        <label>Price (\$)</label>
                        <input type="number" step="0.01" id="p2-price">
                    </div>
                    <div class="input-group">
                        <label>Stock Count</label>
                        <input type="number" id="p2-stock">
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="product-row">
                    <div class="product-name">Galvanized Roofing Nails</div>
                    <div class="input-group">
                        <label>Price (\$)</label>
                        <input type="number" step="0.01" id="p3-price">
                    </div>
                    <div class="input-group">
                        <label>Stock Count</label>
                        <input type="number" id="p3-stock">
                    </div>
                </div>

                <!-- Product 4 -->
                <div class="product-row">
                    <div class="product-name">Drywall Panels (4x8)</div>
                    <div class="input-group">
                        <label>Price (\$)</label>
                        <input type="number" step="0.01" id="p4-price">
                    </div>
                    <div class="input-group">
                        <label>Stock Count</label>
                        <input type="number" id="p4-stock">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-save">Commit Changes to Live Database</button>
        </form>
    </main>

    <script>
        // Crude security check for prototype integration
        if (sessionStorage.getItem('isAdminAuthenticated') !== 'true') {
            alert('Unauthorized Access Attempt. Session Terminated.');
            window.location.href = 'auth.html';
        }

        // Standard Default Data values if not initialized yet
        const defaultData = {
            p1: { price: 3.85, stock: 1420 },
            p2: { price: 14.50, stock: 450 },
            p3: { price: 22.00, stock: 85 },
            p4: { price: 15.95, stock: 310 }
        };

        // Load existing setup values from localStorage
        const currentData = JSON.parse(localStorage.getItem('warehouseInventory')) || defaultData;

        // Populate the input elements on screen load
        for(let key in currentData) {
            document.getElementById(`${key}-price`).value = currentData[key].price;
            document.getElementById(`${key}-stock`).value = currentData[key].stock;
        }

        // Handle structural updates on submit
        document.getElementById('admin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const updatedData = {
                p1: { price: parseFloat(document.getElementById('p1-price').value), stock: parseInt(document.getElementById('p1-stock').value) },
                p2: { price: parseFloat(document.getElementById('p2-price').value), stock: parseInt(document.getElementById('p2-stock').value) },
                p3: { price: parseFloat(document.getElementById('p3-price').value), stock: parseInt(document.getElementById('p3-stock').value) },
                p4: { price: parseFloat(document.getElementById('p4-price').value), stock: parseInt(document.getElementById('p4-stock').value) }
            };

            localStorage.setItem('warehouseInventory', JSON.stringify(updatedData));
            
            const alertBanner = document.getElementById('save-alert');
            alertBanner.style.display = 'block';
            window.scrollTo({top: 0, behavior: 'smooth'});
            setTimeout(() => { alertBanner.style.display = 'none'; }, 4000);
        });

        function logout() {
            sessionStorage.removeItem('isAdminAuthenticated');
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
