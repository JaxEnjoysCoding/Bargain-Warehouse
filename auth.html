<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Portal | Bargain Warehouse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background: #1e293b; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.5rem; color: #f59e0b; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; font-weight: 500; }
        nav a:hover, nav a.active { color: #f59e0b; }
        .container { max-width: 1000px; margin: 4rem auto; padding: 0 1rem; }
        .auth-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; }
        .auth-box { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid #1e293b; }
        .auth-box.pro { border-top-color: #f59e0b; }
        .auth-box h2 { margin-bottom: 1.5rem; color: #1e293b; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
        .form-group input:focus { outline: 2px solid #f59e0b; border-color: transparent; }
        .btn-block { width: 100%; background: #1e293b; color: white; padding: 0.75rem; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-block:hover { background: #f59e0b; color: #1e293b; }
        .auth-box.pro .btn-block { background: #f59e0b; color: #1e293b; }
        .auth-box.pro .btn-block:hover { background: #d97706; color: white; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
        footer { background: #1e293b; color: #94a3b8; text-align: center; padding: 2rem; margin-top: 5rem; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>🏗️ Bargain Warehouse</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="buy.html">Shop Materials</a>
            <a href="auth.html" class="active">Sign In / Up</a>
        </nav>
    </header>

    <main class="container">
        <div class="auth-wrapper">
            
            <!-- Sign In Box -->
            <div class="auth-box">
                <h2>Sign In</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" required placeholder="name@company.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <div id="error-box" class="error-msg">Invalid credentials.</div>
                    </div>
                    <button type="submit" class="btn-block">Access Account</button>
                </form>
            </div>

            <!-- Sign Up Box -->
            <div class="auth-box pro">
                <h2>Register Pro Account</h2>
                <form onsubmit="event.preventDefault(); alert('Registration Submitted!');">
                    <div class="form-group">
                        <label for="reg-name">Full Name / Contact</label>
                        <input type="text" id="reg-name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Business Email</label>
                        <input type="email" id="reg-email" required placeholder="john@builder.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-account">Account Type</label>
                        <select id="reg-account">
                            <option value="individual">Individual / DIYer</option>
                            <option value="contractor">General Contractor</option>
                            <option value="commercial">Commercial Developer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Create Password</label>
                        <input type="password" id="reg-password" required placeholder="Minimum 8 characters">
                    </div>
                    <button type="submit" class="btn-block">Create Account</button>
                </form>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bargain Warehouse Supply Co. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const passwordField = document.getElementById('login-password').value;
            const errorBox = document.getElementById('error-box');

            if (passwordField === 'ryan1984!') {
                // Set admin authentication flag
                sessionStorage.setItem('isAdminAuthenticated', 'true');
                // Redirect to hidden admin page
                window.location.href = 'admin.html';
            </script>
</body>
</html>
